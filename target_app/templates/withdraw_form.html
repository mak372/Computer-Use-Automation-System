{% extends "base.html" %}
{% block title %}Withdraw / Transfer Funds{% endblock %}
{% block content %}
{% if error %}
<table class="grp7" cellpadding="3" cellspacing="0" border="0">
  <tr><td class="err2">{{ error }}</td></tr>
</table>
{% endif %}
<table class="grp2" cellpadding="3" cellspacing="0" border="0">
  <tr><td class="lbl2">Available Balance</td><td class="val2">${{ "%.2f"|format(member.balance) }}</td></tr>
</table>
<table class="grp6" cellpadding="3" cellspacing="0" border="0">
  <tr>
    <td>
      <form action="/member/{{ member.id }}/withdraw" method="post" class="frm5">
        <label>Amount
          <input type="text" name="amount" value="{{ amount or '' }}">
        </label>
        <label>Withdrawal Method
          <select name="method">
            <option value="cash" {% if method == "cash" %}selected{% endif %}>Cash</option>
            <option value="check" {% if method == "check" %}selected{% endif %}>Check</option>
            <option value="transfer" {% if method == "transfer" or not method %}selected{% endif %}>Transfer</option>
          </select>
        </label>
        <label>Memo
          <input type="text" name="memo" value="{{ memo or '' }}">
        </label>
        <button type="submit" class="btn1">Continue</button>
      </form>
    </td>
  </tr>
</table>
{% endblock %}
