{% extends "base.html" %}
{% block title %}Member Detail{% endblock %}
{% block content %}
<table class="grp2" cellpadding="3" cellspacing="0" border="0">
  <tr><td class="lbl2">Name</td><td class="val2">{{ member.name }}</td></tr>
  <tr><td class="lbl2">Member ID</td><td class="val2">{{ member.id }}</td></tr>
  <tr><td class="lbl2">Balance</td><td class="val2">${{ "%.2f"|format(member.balance) }}</td></tr>
</table>
<table class="grp3" cellpadding="3" cellspacing="0" border="0">
  <tr>
    <td><a href="/member/{{ member.id }}/sub-account/new" class="lnk1">Open Sub-Account</a></td>
    <td><a href="/member/{{ member.id }}/withdraw" class="lnk1">Withdraw/Transfer Funds</a></td>
  </tr>
</table>
<table class="grp4" cellpadding="0" cellspacing="0" border="0">
  <tr><td><a href="/admin/delete-member/{{ member.id }}" class="lnk2">Admin: Delete Member</a></td></tr>
</table>
{% endblock %}
